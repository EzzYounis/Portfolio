<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" fill="none">
  <defs>
    <linearGradient id="chatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </linearGradient>
  </defs>

  <!-- Phone background -->
  <rect width="375" height="812" rx="44" fill="url(#chatGrad)"/>
  <!-- Status bar notch -->
  <rect x="110" y="12" width="155" height="28" rx="14" fill="#000000"/>
  <text x="35" y="32" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff">9:41</text>
  <circle cx="340" cy="28" r="4" fill="#ffffff"/>

  <!-- Top Chat Header -->
  <g transform="translate(20, 58)">
    <rect width="335" height="58" rx="14" fill="#18181d" stroke="#26262e"/>
    <circle cx="30" cy="29" r="16" fill="#c8ff3d"/>
    <text x="22" y="35" font-family="'Syne', sans-serif" font-weight="800" font-size="14" fill="#0b0b0c">AI</text>
    <text x="56" y="24" font-family="'Syne', sans-serif" font-weight="700" font-size="14" fill="#ffffff">Ado Counselor</text>
    <circle cx="160" cy="21" r="3" fill="#55e6a5"/>
    <text x="56" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#8b8b86">Powered by OpenAI GPT-4o</text>
  </g>

  <!-- Chat dialogue messages -->
  <!-- Message 1: Student -->
  <g transform="translate(115, 140)">
    <rect width="240" height="60" rx="16" fill="#24262f"/>
    <text x="14" y="24" font-family="'Inter', sans-serif" font-size="12" fill="#ffffff">I have a 3.71 CGPA in Computer</text>
    <text x="14" y="42" font-family="'Inter', sans-serif" font-size="12" fill="#ffffff">Engineering. Which M.S. fits best?</text>
    <text x="195" y="52" font-family="'Inter', sans-serif" font-size="9" fill="#8b8b86">10:14 AM</text>
  </g>

  <!-- Message 2: Ado AI -->
  <g transform="translate(20, 220)">
    <rect width="280" height="150" rx="18" fill="#1b2315" stroke="rgba(200, 255, 61, 0.3)"/>
    <text x="16" y="28" font-family="'Syne', sans-serif" font-weight="700" font-size="13" fill="#c8ff3d">Ado AI Counselor</text>
    <text x="16" y="52" font-family="'Inter', sans-serif" font-size="12" fill="#ededea">Your 3.71 CGPA places you in the</text>
    <text x="16" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#ededea">top tier! Based on your full-stack</text>
    <text x="16" y="88" font-family="'Inter', sans-serif" font-size="12" fill="#ededea">&amp; cloud profile, I strongly recommend:</text>
    
    <!-- University Recommendation Pill -->
    <rect x="16" y="102" width="248" height="34" rx="8" fill="#12180d" stroke="#2f421b"/>
    <text x="26" y="123" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#c8ff3d">Hacettepe University — Thesis M.S.</text>
  </g>

  <!-- Message 3: Student -->
  <g transform="translate(95, 390)">
    <rect width="260" height="50" rx="16" fill="#24262f"/>
    <text x="14" y="24" font-family="'Inter', sans-serif" font-size="12" fill="#ffffff">Can I upload my transcripts now?</text>
    <text x="14" y="40" font-family="'Inter', sans-serif" font-size="10" fill="#8b8b86">Direct cloud storage</text>
  </g>

  <!-- Message 4: Ado AI -->
  <g transform="translate(20, 460)">
    <rect width="290" height="110" rx="18" fill="#1b2315" stroke="rgba(200, 255, 61, 0.3)"/>
    <text x="16" y="28" font-family="'Syne', sans-serif" font-weight="700" font-size="13" fill="#c8ff3d">Ado AI Counselor</text>
    <text x="16" y="52" font-family="'Inter', sans-serif" font-size="12" fill="#ededea">Yes! Tap below to upload via</text>
    <text x="16" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#ededea">secure AWS S3 presigned URLs.</text>
    <rect x="16" y="80" width="160" height="22" rx="4" fill="#243314"/>
    <text x="24" y="95" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c8ff3d">🔒 Encrypted Transfer</text>
  </g>

  <!-- Suggested Action Chips -->
  <g transform="translate(20, 595)">
    <rect x="0" y="0" width="155" height="32" rx="16" fill="#18181d" stroke="#292933"/>
    <text x="14" y="20" font-family="'Inter', sans-serif" font-size="11" fill="#a3a39e">Check Deadlines 🗓</text>

    <rect x="165" y="0" width="170" height="32" rx="16" fill="#18181d" stroke="#292933"/>
    <text x="179" y="20" font-family="'Inter', sans-serif" font-size="11" fill="#a3a39e">Scholarship Match 🎓</text>
  </g>

  <!-- Chat Input Bar -->
  <g transform="translate(20, 645)">
    <rect width="335" height="52" rx="26" fill="#17181c" stroke="#2d2d38"/>
    <text x="20" y="31" font-family="'Inter', sans-serif" font-size="13" fill="#66666e">Ask Ado about admissions...</text>
    <circle cx="308" cy="26" r="16" fill="#c8ff3d"/>
    <path d="M304 22 L312 26 L304 30 Z" fill="#0b0b0c"/>
  </g>

  <!-- Bottom Home Bar -->
  <rect x="135" y="795" width="105" height="4" rx="2" fill="#ffffff"/>
</svg>
