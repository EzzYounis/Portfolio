<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" fill="none">
  <defs>
    <linearGradient id="m1Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151518"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </linearGradient>
  </defs>

  <!-- Phone background -->
  <rect width="375" height="812" rx="44" fill="url(#m1Grad)"/>
  <!-- Status bar notch -->
  <rect x="110" y="12" width="155" height="28" rx="14" fill="#000000"/>
  <text x="35" y="32" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff">9:41</text>
  <circle cx="340" cy="28" r="4" fill="#ffffff"/>

  <!-- Top App Bar -->
  <g transform="translate(24, 60)">
    <circle cx="20" cy="20" r="18" fill="#1c1d22" stroke="#2a2a30"/>
    <text x="14" y="25" font-family="'Syne', sans-serif" font-weight="bold" font-size="14" fill="#c8ff3d">A</text>
    <text x="50" y="18" font-family="'Inter', sans-serif" font-size="11" fill="#8b8b86">WELCOME BACK</text>
    <text x="50" y="34" font-family="'Syne', sans-serif" font-weight="700" font-size="16" fill="#ffffff">Admitra Student</text>
  </g>

  <!-- Application Card -->
  <g transform="translate(20, 125)">
    <rect width="335" height="150" rx="18" fill="#1c1d22" stroke="rgba(200, 255, 61, 0.25)" stroke-width="1.5"/>
    <rect x="18" y="18" width="90" height="24" rx="6" fill="#243015"/>
    <text x="26" y="34" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#c8ff3d">IN PROGRESS</text>
    <text x="18" y="70" font-family="'Syne', sans-serif" font-weight="700" font-size="18" fill="#ffffff">Hacettepe University</text>
    <text x="18" y="90" font-family="'Inter', sans-serif" font-size="12" fill="#a3a39e">M.S. in Computer Engineering</text>
    
    <!-- Progress bar -->
    <rect x="18" y="115" width="299" height="6" rx="3" fill="#28282e"/>
    <rect x="18" y="115" width="240" height="6" rx="3" fill="#c8ff3d"/>
    <text x="18" y="138" font-family="'Inter', sans-serif" font-size="10" fill="#8b8b86">Stage 4 of 5 · Documents Verified</text>
    <text x="280" y="138" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c8ff3d">80%</text>
  </g>

  <!-- AI Counselor Banner -->
  <g transform="translate(20, 295)">
    <rect width="335" height="90" rx="16" fill="#141c10" stroke="#2e421a" stroke-width="1"/>
    <circle cx="45" cy="45" r="22" fill="#c8ff3d"/>
    <text x="35" y="52" font-family="'Syne', sans-serif" font-weight="800" font-size="18" fill="#0b0b0c">AI</text>
    <text x="80" y="38" font-family="'Syne', sans-serif" font-weight="700" font-size="14" fill="#ffffff">Ask Ado AI Counselor</text>
    <text x="80" y="55" font-family="'Inter', sans-serif" font-size="11" fill="#c2c2bc">"Which scholarship fits my 3.71 CGPA?"</text>
    <text x="80" y="70" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#c8ff3d">Start guidance session →</text>
  </g>

  <!-- Recommended Programs -->
  <g transform="translate(20, 410)">
    <text x="4" y="16" font-family="'Syne', sans-serif" font-weight="700" font-size="15" fill="#ffffff">Matched Universities</text>
    
    <!-- Item 1 -->
    <g transform="translate(0, 30)">
      <rect width="335" height="75" rx="14" fill="#17181c" stroke="#25252b"/>
      <text x="16" y="28" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#ffffff">Muğla Sıtkı Koçman University</text>
      <text x="16" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#8b8b86">B.S. Computer Engineering · Graduated</text>
      <text x="16" y="62" font-family="'JetBrains Mono', monospace" font-size="10" fill="#c8ff3d">Match Rate: 98%</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 115)">
      <rect width="335" height="75" rx="14" fill="#17181c" stroke="#25252b"/>
      <text x="16" y="28" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#ffffff">Anadolu University</text>
      <text x="16" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#8b8b86">Associate Degree in Programming</text>
      <text x="16" y="62" font-family="'JetBrains Mono', monospace" font-size="10" fill="#55e6a5">Verified Transcript</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 725)">
    <rect width="375" height="87" fill="#111114" stroke="#1f1f24"/>
    <text x="40" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#c8ff3d">HOME</text>
    <text x="125" y="32" font-family="'Inter', sans-serif" font-size="10" fill="#8b8b86">APPLICATIONS</text>
    <text x="245" y="32" font-family="'Inter', sans-serif" font-size="10" fill="#8b8b86">ADO AI</text>
    <text x="315" y="32" font-family="'Inter', sans-serif" font-size="10" fill="#8b8b86">PROFILE</text>
    <rect x="135" y="70" width="105" height="4" rx="2" fill="#ffffff"/>
  </g>
